# Modified Ultralytics YOLO 

# Parameters
nc: 1  # number of classes
# Summary: 82 layers, 137545 parameters, 137529 gradients, 1.0 GFLOPs


# YOLOmodv8 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [8, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [8, 3, 2]]  # 1-P2/4
  - [-1, 1, C2f, [8, True]]
  - [-1, 1, Conv, [16, 3, 2]]  # 3-P3/8
  - [-1, 2, C2f, [16, True]]
  - [-1, 1, Conv, [32, 3, 2]]  # 5-P4/16
  - [-1, 2, C2f, [32, True]]
  - [-1, 1, Conv, [64, 3, 2]]  # 7-P5/32
  - [-1, 1, C2f, [64, True]] # 8

# YOLOmodv8 head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 1, C2f, [32]]  # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 1, C2f, [16]]  # 14 (P3/8-small)

  - [[14], 1, Detect, [nc]]  # Detect(P3)
